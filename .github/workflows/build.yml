name: Build, test and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Semantic version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test version validation
        shell: pwsh
        run: |
          ./scripts/Test-Versioning.ps1
          ./scripts/Test-Releases.ps1
      - name: Require a developer-selected version increase
        id: version
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/Validate-Version.ps1 -BaseRef $env:BASE_SHA

  windows:
    name: Build, test and package
    needs: version
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Unit, integration and desktop tests
        run: ./scripts/Test.ps1
      - name: Install verified Inno compiler
        run: ./scripts/Install-InnoCompiler.ps1
      - name: Build portable and installer packages
        env:
          # Optional: an Authenticode command line containing the $f placeholder. Configured
          # repositories sign the app, installer and uninstaller; without it builds stay unsigned.
          SIGNTOOL_COMMAND: ${{ secrets.SIGNTOOL_COMMAND }}
        run: |
          $packaging = @{ InnoCompiler = '.tools/inno/ISCC.exe' }
          if ($env:SIGNTOOL_COMMAND) { $packaging.SignToolCommand = $env:SIGNTOOL_COMMAND }
          ./scripts/Build-Packages.ps1 @packaging
      - name: Installer lifecycle test
        run: |
          $installer = Get-ChildItem artifacts/packages/*-Setup.exe | Select-Object -First 1
          ./scripts/Test-Installer.ps1 -Installer $installer.FullName
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn
      - name: Upload installable packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SoundAnchor-win-x64
          path: artifacts/packages/
          if-no-files-found: error

  release:
    name: Publish merged PR release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, windows]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish this merged commit's verified packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCT_VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/Publish-Release.ps1 -Version $env:PRODUCT_VERSION -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID
